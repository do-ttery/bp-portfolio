baseURL = "https://do-ttery.github.io/bp-portfolio/"
title = "문도경"

languageCode = "ko"
defaultContentLanguage = "ko"
enableEmoji = true
# 블로그 글이 없어 tags·categories·authors 분류 목록이 빈 페이지로만 생성되므로 끔
disableKinds = ["taxonomy", "term"]

[pagination]
pagerSize = 6

[markup]
[markup.highlight]
noClasses = false

[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[params]
author = "문도경"
# license = '<a rel="license" href="http://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA-4.0</a>'
description = "전북대학교 컴퓨터공학부 문도경의 개인 소개 사이트"
keywords = "문도경,전북대학교,컴퓨터공학,백엔드,포트폴리오"
info = ["전북대학교 컴퓨터공학부", "작품경진대회 대상 · 네이버 커넥트재단 AI Agent Challenge 우수 사례"]
# 아바타 없이 이름·소개 텍스트만 표시 (데모 실루엣 이미지 제거). 사진을 쓰면 site/static/images/에 넣고 경로 지정
# avatarURL = "images/본인사진.jpg"
dateFormat = "2006년 1월 2일"
since = 2026
# Git Commit in Footer, uncomment the line below to enable it
# (사용 안 함: 빌드에서 enableGitInfo=false라 표시되지 않고, 값이 테마 원작자 저장소를 가리키고 있었음)
# commit = "https://github.com/do-ttery/bp-portfolio/tree/"
# Right To Left, shift content direction for languages such as Arabic
rtl = false
# Specify light/dark colorscheme
# Supported values:
# "auto" (use preference set by browser)
# "dark" (dark background, light foreground)
# "light" (light background, dark foreground) (default)
colorScheme = "auto"
# Hide the toggle button, along with the associated vertical divider
hideColorSchemeToggle = false
# Series see also post count
maxSeeAlsoItems = 5
# Custom CSS
customCSS = ["css/a11y.css"]
# Custom SCSS, file path is relative to Hugo's asset folder (default: {your project root}/assets)
customSCSS = []

# Custom JS
customJS = []

# Custom remote JS files
customRemoteJS = []

[[params.social]]
name = "GitHub"
icon = "fa-brands fa-github fa-2x"
weight = 1
url = "https://github.com/do-ttery"

[languages.ko]
languageName = "한국어"

[[languages.ko.menu.main]]
name = "소개"
weight = 1
url = "about/"

[[languages.ko.menu.main]]
name = "활동"
weight = 3
url = "projects/"
