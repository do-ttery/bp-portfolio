{{/* 테마 float.html 재정의 — 다크모드 전환 버튼.
     원본은 href 없는 <a>에 아이콘만 있어 Tab으로 도달할 수 없고(포커스 불가) 접근 가능한 이름도 없었음.
     → tabindex="0"으로 Tab 도달, role="button"과 aria-label로 버튼 역할·이름 제공.
     (<button>으로 바꾸면 테마 CSS가 a 기준이라 모양이 깨져서 <a>를 유지)
     <a>는 버튼과 달리 키보드 실행이 기본 제공되지 않아, Enter·Space를 누르면 클릭과 같이 동작하게 onkeydown 추가 */}}
{{ if not .Site.Params.hideColorSchemeToggle }}
<div class="float-container">
    <a id="dark-mode-toggle" class="colorscheme-toggle" role="button" tabindex="0" aria-label="화면 밝기 모드 전환 (밝게/어둡게)"
       onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); this.click(); }">
        <i class="fa-solid fa-adjust fa-fw" aria-hidden="true"></i>
    </a>
</div>
{{ end }}
